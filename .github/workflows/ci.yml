name: CI

# Runs the test suite on every push / pull request to main (and on demand).
# This replaces GitHub's "Hello, world!" starter workflow with a real CI.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Curated subset that covers the whole test suite (faster than full requirements.txt).
      - name: Install test dependencies
        run: pip install pandas numpy scipy scikit-learn xgboost statsmodels requests python-dotenv pytest

      - name: Run tests
        run: python -m pytest tests/ -q
