name: Build & Deploy Stock Site

# Twice-daily refresh: pre-open 08:30 IST (03:00 UTC) and post-close 18:00 IST (12:30 UTC),
# Mon–Fri. Also deploys on manual dispatch and on push to this workflow (first deploy).
on:
  schedule:
    - cron: "0 3 * * 1-5"     # 08:30 IST  (pre-open)
    - cron: "30 12 * * 1-5"   # 18:00 IST  (post-close)
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/deploy-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # exhaustive AI + ML deep-dive can run for hours
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      MODELS_TOKEN: ${{ secrets.MODELS_TOKEN }}          # GitHub Models (free) — models:read PAT
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # optional: switches AI to Claude Opus
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}        # optional
      REC_TOP: ${{ vars.REC_TOP || '300' }}               # universe size for recommendations
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: pip install pandas numpy requests yfinance scikit-learn xgboost beautifulsoup4 lxml

      # Persist the Gen-AI analysis cache across runs so coverage accumulates and
      # exhaustive deep-dives are resumable (each run continues where the last left off).
      - name: Restore AI analysis cache
        uses: actions/cache@v4
        with:
          path: data/ai_cache
          key: ai-cache-${{ github.run_id }}
          restore-keys: |
            ai-cache-

      - name: Choose data source (licensed vendor if key present, else hybrid top-50)
        id: src
        run: |
          if [ -n "$TWELVEDATA_API_KEY" ]; then
            echo "source=twelvedata" >> "$GITHUB_OUTPUT"
            echo "Using Twelve Data (licensed source)."
          else
            echo "source=hybrid" >> "$GITHUB_OUTPUT"
            echo "::notice::No key — ranking the FULL Indian market via TradingView and displaying the top 50 from Yahoo Finance (educational). Falls back to Nifty 50 / sample if upstreams are unavailable."
          fi

      - name: Report AI provider
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "::notice::AI: Anthropic Claude (Opus-capable).";
          elif [ -n "$MODELS_TOKEN" ]; then echo "::notice::AI: GitHub Models (free).";
          else echo "::warning::No MODELS_TOKEN/ANTHROPIC_API_KEY secret — recommendations fall back to the deterministic (rules-based) analyst."; fi

      - name: Build site (top 50 + movers + Nifty 50 + AI Buy/Sell/Hold + Search)
        run: >
          python -m scripts.build_all_stocks
          --source ${{ steps.src.outputs.source }} --mode full --top 50
          --with-movers --movers-source yfinance --movers-top 10
          --with-nifty50
          --with-recommendations --rec-top ${REC_TOP}
          --out ./site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
